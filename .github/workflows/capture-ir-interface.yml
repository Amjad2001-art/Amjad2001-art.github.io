name: Capture original IR Streamlit interface
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/capture-ir-interface.yml"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install streamlit pandas requests streamlit-keyup playwright Pillow
          python -m playwright install chromium --with-deps
          git clone --depth 1 https://github.com/Amjad2001-art/IR-Project.git /tmp/original-ir
      - name: Start metadata-only backend and original Streamlit UI
        run: |
          cat >/tmp/ir_metadata_server.py <<'PY'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          import json
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  payload={'status':'ok'} if self.path=='/health' else {'datasets':[{'id':'dataset1','document_count':369721}]} if self.path=='/datasets' else {}
                  body=json.dumps(payload).encode()
                  self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
              def do_POST(self):
                  body=b'{"suggestions":[]}'
                  self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
          HTTPServer(('127.0.0.1',8000),Handler).serve_forever()
          PY
          python /tmp/ir_metadata_server.py >/tmp/metadata.log 2>&1 &
          cd /tmp/original-ir
          python -m streamlit run frontend/streamlit_app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false >/tmp/streamlit.log 2>&1 &
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import time,urllib.request
          for i in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8501',timeout=2)
                  break
              except Exception:time.sleep(1)
          with sync_playwright() as p:
              b=p.chromium.launch(args=['--no-sandbox'])
              page=b.new_page(viewport={'width':1440,'height':900})
              page.goto('http://127.0.0.1:8501',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(8000)
              body=page.locator('body').inner_text()
              assert 'Information Retrieval Search Engine' in body, body[:300]
              assert 'FastAPI backend is not available' not in body
              path=Path('assets/screenshots/IR-Project.png')
              path.parent.mkdir(parents=True,exist_ok=True)
              page.screenshot(path=str(path),full_page=False,animations='disabled')
              print('ORIGINAL STREAMLIT UI SCREENSHOT',path,flush=True)
              b.close()
          PY
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/IR-Project.png
          git commit -m "Add genuine screenshot of the original IR Streamlit interface"
          git pull --rebase origin main
          git push origin HEAD:main
